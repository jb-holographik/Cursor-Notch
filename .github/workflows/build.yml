name: macOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
      - name: Build Release
        shell: bash
        run: |
          set +e
          xcodebuild \
            -project CursorNotch.xcodeproj \
            -scheme CursorNotch \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E 'error:|fatal error:|BUILD FAILED' build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$status"
          fi
